<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural da Turma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>📌 Mural da Turma</h1>
    <p class="subtitulo">Deixe um recado para a galera!</p>

    <form id="form-recado">
      <input type="text" id="autor" placeholder="Seu nome" maxlength="40" required>
      <textarea id="mensagem" placeholder="Escreva seu recado..." maxlength="280" required></textarea>
      <button type="submit">Publicar recado</button>
    </form>

    <section id="lista-recados"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
